apis:
- aid: materialize:materialize-http-api
  name: Materialize HTTP API
  humanURL: https://materialize.com/docs/integrations/http-api/
  baseURL: https://{mz_host}/api/sql
  tags:
  - SQL
  - HTTP
  - Streaming
  description: >-
    Session-less HTTP API for executing SQL statements against a Materialize region. Authenticates with
    HTTP Basic (email + app password). Supports a simple mode with a single query and an extended mode
    that submits an array of queries, each with optional parameters. Does not support session-bound statements
    such as SUBSCRIBE, DECLARE, FETCH, or COPY.
  properties:
  - type: Documentation
    url: https://materialize.com/docs/integrations/http-api/
  - type: Authentication
    url: https://materialize.com/docs/manage/access-control/
- aid: materialize:materialize-pgwire
  name: Materialize PostgreSQL Wire Protocol
  humanURL: https://materialize.com/docs/integrations/
  baseURL: postgres://{user}@{mz_host}:6875/materialize
  tags:
  - SQL
  - PostgreSQL
  - psql
  - Wire Protocol
  description: >-
    Materialize speaks the PostgreSQL wire protocol on port 6875, so any psql or libpq-based client (Go,
    Java, Node.js, PHP, Python, Ruby, Rust) can connect and run streaming SQL.
  properties:
  - type: Documentation
    url: https://materialize.com/docs/integrations/
- aid: materialize:materialize-streaming-asyncapi
  name: Materialize Streaming Sources and Sinks (AsyncAPI)
  humanURL: https://materialize.com/docs/sql/create-source/
  baseURL: https://materialize.com/docs/
  tags:
  - Streaming
  - Kafka
  - Webhook
  - AsyncAPI
  - Sources
  - Sinks
  tags_raw:
  - Streaming
  - Kafka
  - Webhooks
  - AsyncAPI
  - Sources
  - Sinks
  description: >-
    AsyncAPI 2.6 description of Materialize's event-driven integration surface: Kafka sources (CREATE
    SOURCE ... FROM KAFKA), Kafka sinks (CREATE SINK ... INTO KAFKA), and HTTP webhook sources (CREATE
    SOURCE ... FROM WEBHOOK). SUBSCRIBE is documented in the spec as an informational pgwire server only;
    AsyncAPI 2.6 has no standard binding for the PostgreSQL wire protocol, so it is intentionally not
    modelled as a channel.
  properties:
  - type: AsyncAPI
    url: asyncapi/materialize-asyncapi.yml
  - type: Documentation
    url: https://materialize.com/docs/sql/create-source/kafka/
  - type: Documentation
    url: https://materialize.com/docs/sql/create-sink/kafka/
  - type: Documentation
    url: https://materialize.com/docs/sql/create-source/webhook/
  - type: Documentation
    url: https://materialize.com/docs/sql/subscribe/
